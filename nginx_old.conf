events {
    worker_connections 1024;
}

http {
    access_log off;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream get_backend {
        zone get_backend 64k;
        server get-server:8001 resolve;
        keepalive 32;
    }

    upstream post_backend {
        zone post_backend 64k;
        server post-server:8001 resolve;
        keepalive 32;
    }

    map $request_method $backend {
        GET     get_backend;
        POST    post_backend;
        PUT    post_backend;
    }

    server {
        listen 8000 reuseport;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;

            proxy_pass http://$backend;
        }
    }
}