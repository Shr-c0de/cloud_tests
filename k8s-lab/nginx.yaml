apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        access_log off;

        upstream get_backend {
            server get-server-service:8001;
            keepalive 32;
        }

        upstream post_backend {
            server server-service:8001;
            keepalive 32;
        }

        map $request_method $backend {
            GET     get_backend;
            POST    post_backend;
            PUT     post_backend;
        }

        server {
            listen 8000;

            location / {
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;

                proxy_pass http://$backend;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000