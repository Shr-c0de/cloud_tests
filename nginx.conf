events {
    worker_connections 4096;
}

http {

    access_log off;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream post_backend {
        zone post_backend 64k;

        server post-server-1:8001;
        server post-server-2:8001;
        server post-server-3:8001;
        server post-server-4:8001;

        keepalive 128;
    }

    server {

        listen 8000 reuseport;

        location / {

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;

            proxy_pass http://post_backend;
        }
    }
}